name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q FireBrowser.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: FireBrowser
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp FireBrowser/app/build/outputs/apk/debug/app-debug.apk FireBrowser.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          files: FireBrowser.apk
